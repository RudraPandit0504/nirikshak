[project]
name = "nirikshak"
version = "0.1.0"
description = "Local-first AI auditor for finance-influencer videos"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "yt-dlp[default]>=2026.8.19",
  "faster-whisper>=1.1",
  "rapidfuzz>=3.9",
  "pydantic>=2.7",
  "openpyxl>=3.1",
  "beautifulsoup4>=4.12",
  "kokoro-onnx>=0.6.1",
  "soundfile>=0.14.0",
  "deno>=2.9.7",
]

[project.optional-dependencies]
# CUDA libraries for Whisper on an NVIDIA GPU (local setup). The hosted demo runs on CPU without them.
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]

[project.scripts]
nirikshak = "nirikshak.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nirikshak"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
