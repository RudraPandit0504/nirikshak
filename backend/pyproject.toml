[project]
name = "nirikshak"
version = "0.1.0"
description = "Local-first AI auditor for finance-influencer videos"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "yt-dlp>=2025.1.1",
  "faster-whisper>=1.1",
  "nvidia-cublas-cu12",
  "nvidia-cudnn-cu12>=9,<10",
  "rapidfuzz>=3.9",
  "pydantic>=2.7",
  "openpyxl>=3.1",
  "beautifulsoup4>=4.12",
]

[project.scripts]
nirikshak = "nirikshak.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nirikshak"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
