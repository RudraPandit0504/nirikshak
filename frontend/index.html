<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef1f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#05070d" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Local-first AI auditor for finance-influencer videos. Flags guaranteed-return promises, stock tips and unregistered advice, and checks SEBI registration." />
    <title>Nirikshak – Finfluencer Auditor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&family=Mukta:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var t = 'system';
        try { t = localStorage.getItem('nirikshak-theme') || 'system'; } catch (e) {}
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
